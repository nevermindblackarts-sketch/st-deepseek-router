<div class="dsh-router-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="DeepSeek 路由器（DSH Standard 移植）">DeepSeek 路由器（DSH Standard 移植）</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="dsh-router-status">
                <span class="dsh-router-status-label" data-i18n="模型族">模型族</span>
                <span id="dsh_router_status_family">—</span>
                <span class="dsh-router-status-label" data-i18n="路由">路由</span>
                <span id="dsh_router_status_task">—</span>
                <span class="dsh-router-status-label" data-i18n="Persona">Persona</span>
                <span id="dsh_router_status_persona">—</span>
            </div>
            <label class="dsh-router-label" for="dsh_router_mode" data-i18n="路由模式">路由模式</label>
            <select id="dsh_router_mode" class="text_pole">
                <option value="auto" {{modeAuto}} data-i18n="自动（按首条用户消息分类）">自动（按首条用户消息分类）</option>
                <option value="spec" {{modeSpec}} data-i18n="spec — 深度推理">spec — 深度推理</option>
                <option value="react" {{modeReact}} data-i18n="react — 快循环">react — 快循环</option>
                <option value="weak" {{modeWeak}} data-i18n="weak — 轻任务">weak — 轻任务</option>
                <option value="standard" {{modeStandard}} data-i18n="standard — RL 接口还原">standard — RL 接口还原</option>
                <option value="off" {{modeOff}} data-i18n="关闭">关闭</option>
            </select>
            <label class="dsh-router-label" for="dsh_router_position" data-i18n="Persona 注入位置">Persona 注入位置</label>
            <select id="dsh_router_position" class="text_pole">
                <option value="first" {{positionFirst}} data-i18n="最前的 system 消息">最前的 system 消息</option>
                <option value="after-system" {{positionAfterSystem}} data-i18n="系统提示块之后">系统提示块之后</option>
            </select>
            <label class="checkbox_label">
                <input id="dsh_router_anchors" type="checkbox" {{anchorsChecked}}>
                <span data-i18n="反空转锚点（Pro/Flash，距窗口尾 8/20/36）">反空转锚点（Pro/Flash，距窗口尾 8/20/36）</span>
            </label>
            <label class="checkbox_label">
                <input id="dsh_router_guidance" type="checkbox" {{guidanceChecked}}>
                <span data-i18n="深度自适应收敛引导">深度自适应收敛引导</span>
            </label>
            <label class="checkbox_label">
                <input id="dsh_router_all_models" type="checkbox" {{allModelsChecked}}>
                <span data-i18n="对非 DeepSeek 模型也生效">对非 DeepSeek 模型也生效</span>
            </label>
            <details class="dsh-router-personas">
                <summary data-i18n="Persona 覆写（留空 = 上游内置）">Persona 覆写（留空 = 上游内置）</summary>
                <label class="dsh-router-label" for="dsh_router_persona_spec">spec</label>
                <input id="dsh_router_persona_spec" class="text_pole textarea_compact" type="text" value="{{personaSpec}}">
                <label class="dsh-router-label" for="dsh_router_persona_react">react</label>
                <input id="dsh_router_persona_react" class="text_pole textarea_compact" type="text" value="{{personaReact}}">
                <label class="dsh-router-label" for="dsh_router_persona_weak">weak</label>
                <input id="dsh_router_persona_weak" class="text_pole textarea_compact" type="text" value="{{personaWeak}}">
            </details>
            <div class="dsh-router-buttons">
                <div id="dsh_router_reclassify" class="menu_button" data-i18n="重新分类本聊天">重新分类本聊天</div>
                <div id="dsh_router_reset" class="menu_button" data-i18n="恢复默认设置">恢复默认设置</div>
            </div>
            <div class="dsh-router-note" data-i18n="standard 模式会把所有 system 消息替换为 RL 训练句，角色卡不会到达模型。仅对 Chat Completion 接口生效。所有改动只作用于发送的提示，不修改已存储的消息。">standard 模式会把所有 system 消息替换为 RL 训练句，角色卡不会到达模型。仅对 Chat Completion 接口生效。所有改动只作用于发送的提示，不修改已存储的消息。</div>
        </div>
    </div>
</div>
